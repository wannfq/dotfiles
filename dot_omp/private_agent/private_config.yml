statusLine:
  separator: ascii
  preset: default
  sessionAccent: false
  transparent: true
display:
  shimmer: classic
  showTokenUsage: true
modelRoles:
  smol: openai-codex/gpt-5.6-luna:high
  default: openai-codex/gpt-5.6-luna:xhigh
  slow: openai-codex/gpt-5.6-terra:xhigh
  task: openai-codex/gpt-5.6-luna:xhigh
  plan: openai-codex/gpt-5.6-terra:xhigh
  commit: openai-codex/gpt-5.6-luna:low
  vision: openai-codex/gpt-5.6-terra:high
  designer: openai-codex/gpt-5.6-terra:xhigh
  advisor: openai-codex/gpt-5.6-luna:high
  tiny: openai-codex/gpt-5.6-luna:medium
symbolPreset: nerd
defaultThinkingLevel: auto
memory:
  backend: local
task:
  maxConcurrency: 16
  agentModelOverrides: {}
  disabledAgents: []
  showResolvedModelBadge: true
  eager: preferred
  agentAdvisor:
    task: "on"
hideThinkingBlock: false
providers:
  webSearchOrder:
    - codex
    - exa
    - searxng
    - perplexity
    - gemini
    - anthropic
    - xai
    - zai
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
setupVersion: 2
theme:
  dark: dark-catppuccin
  light: light-catppuccin
tui:
  textSizing: true
  hyperlinks: auto
interruptMode: wait
marketplace:
  autoUpdate: auto
repeatToolDescriptions: false
personality: default
retry:
  modelFallback: true
  maxRetries: 5
inspect_image:
  mode: "on"
github:
  enabled: true
vault:
  enabled: false
readLineNumbers: true
secrets:
  enabled: true
browser:
  headless: false
advisor:
  enabled: true
searxng:
  endpoint: http://127.0.0.1:8888
disabledProviders:
  - ollama
  - llama.cpp
  - lm-studio
dev:
  autoqaConsent: granted
steeringMode: one-at-a-time
followUpMode: one-at-a-time
composer:
  shape: rule
web_search:
  enabled: true
