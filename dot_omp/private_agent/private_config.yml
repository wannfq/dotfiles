statusLine:
  separator: ascii
  preset: default
  sessionAccent: false
  transparent: true
display:
  shimmer: classic
  showTokenUsage: true
modelRoles:
  smol: opencode-go/deepseek-v4-flash:high
  default: openai-codex/gpt-5.6-luna:max
  slow: openai-codex/gpt-5.6-sol:medium
  task: opencode-go/deepseek-v4-flash:max
  plan: openai-codex/gpt-5.6-sol:medium
  commit: opencode-go/deepseek-v4-flash:high
  vision: opencode-go/kimi-k2.6:medium
  designer: opencode-go/minimax-m3:xhigh
  advisor: opencode-go/deepseek-v4-flash:max
  tiny: opencode-go/deepseek-v4-flash:high
symbolPreset: nerd
defaultThinkingLevel: auto
memory:
  backend: local
task:
  maxConcurrency: 16
  agentModelOverrides: {}
  disabledAgents: []
  showResolvedModelBadge: true
  eager: preferred
hideThinkingBlock: false
providers:
  webSearchOrder:
    - searxng
    - exa
    - codex
    - perplexity
    - gemini
    - anthropic
    - xai
    - zai
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
setupVersion: 1
theme:
  dark: dark-catppuccin
  light: light-catppuccin
tui:
  textSizing: true
  hyperlinks: auto
interruptMode: wait
marketplace:
  autoUpdate: auto
repeatToolDescriptions: false
personality: default
retry:
  modelFallback: true
  maxRetries: 5
inspect_image:
  mode: "on"
github:
  enabled: true
vault:
  enabled: false
readLineNumbers: true
secrets:
  enabled: true
browser:
  headless: false
advisor:
  enabled: true
  subagents: true
searxng:
  endpoint: http://127.0.0.1:8888
disabledProviders:
  - ollama
  - llama.cpp
  - lm-studio
dev:
  autoqaConsent: granted
steeringMode: one-at-a-time
followUpMode: one-at-a-time
